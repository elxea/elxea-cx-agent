account_id = "1ffc231d9346f5e4e4110d4850b28a70"
name = "elxea-agent"
main = "src/index.ts"
compatibility_date = "2025-03-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[ai]
binding = "AI"

[observability]
enabled = true

# 定期同期（毎日 AM3:00 JST = PM6:00 UTC）は 2026-07-02 休止 — LINE AI チャネル休止のため日次 cron を除去（再開時は "0 18 * * *" を crons 先頭に戻す）
# セグメント配信（1日・15日 AM6:00 JST = PM9:00 UTC 前日）
[triggers]
crons = ["0 21 1,15 * *"]

# ── Staging 環境 ──
[env.staging]
name = "elxea-agent-staging"

[env.staging.ai]
binding = "AI"
