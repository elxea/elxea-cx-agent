account_id = "1ffc231d9346f5e4e4110d4850b28a70"
name = "elxea-agent"
main = "src/index.ts"
compatibility_date = "2025-03-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# デプロイ時に既存の Workers Secrets を消さない（wrangler は toml に無い vars/secrets を既定で削除しうる）。
# top-level（本番/default env）に置く。staging にも top-level が波及する。
# ⚠ [env.staging] には keep_vars を入れない（wrangler が認識しない無効キーで警告になる）。
keep_vars = true

# ── 非機密 vars（本番 / default env）──
# チャット返信モデル（最安クラス Haiku 4.5）。モデル名は機密でないため vars で管理する。
# 未設定でも core.ts の DEFAULT_REPLY_MODEL に同値でフォールバックするが、本番でも明示して
# staging（[env.staging.vars]）とパリティを取る（挙動不変）。
[vars]
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"
# 配信対象 OA の固定（本番）。未設定だと delivery-channel.ts が fail-closed で "test" に倒れ、
# 本番に test トークンが無いため 15分毎 cron が毎 tick resolveDeliveryChannel で例外を投げていた
# （誤送信ゼロの安全な故障だが監視ノイズ）。本番は本番 OA（@307tzhkw）に明示固定する。
#   ⚠ 2026-08-22: 実送信スイッチ（旧 secret DELIVERY_SEND_ENABLED）は撤去した。さらに同日、
#     一斉配信は **完全オンデマンド** になった（cron からの自動配信を廃止）。承認済み
#     （Status=Approved）の行は、`POST /api/delivery/run` を叩いたときにだけ実送信される。
#     DELIVERY_TARGET_ENV="prod" は送信先 OA を本番（@307tzhkw / 実顧客）に固定する指定であり、
#     ここが "prod" の Worker で run を叩くと本番の友だち全員に届く。テストは staging 側で行うこと。
DELIVERY_TARGET_ENV = "prod"

[ai]
binding = "AI"

[observability]
enabled = true

# ── Cron Triggers ──
# ⚠ 2026-08-22（Setaka 指示・完全オンデマンド化）: **一斉配信の cron は登録しない**。
#   旧 "*/15 * * * *"（15分毎の自動配信）は撤去した。承認済み行が時刻到来で自動送信される経路は
#   もう存在しない。配信は `POST /api/delivery/run` を明示的に叩いたときにだけ走る
#   （docs/deploy-runbook.md「LINE 配信の運用ゲート」/ docs/line-delivery-guide.md 参照）。
#   多層防御: 万一この crons に "*/15 * * * *" が復活しても、src/index.ts の scheduled ハンドラは
#   cronKind==="delivery" を **no-op** で握りつぶす（配信は発火しない）。cron を復活させるだけでは
#   自動配信に戻らない = 意図しない自動化の再混入を構造的に防ぐ。
#
#   ここに残す cron は「配信以外の定期処理」だけ:
#   - 日次同期（毎日 AM3:00 JST = PM6:00 UTC）: "0 18 * * *"。
#       classifyCron → "sync" → ナレッジ同期 + karte 照合 + Shopify Metafield バッチ同期。
#       非破壊（LINE 送信系 API に触れない）。配信オンデマンド化の影響を受けない。
#   - 旧・セグメント配信（T10 退役）"0 21 1,15 * *" は再登録しない。
[triggers]
crons = ["0 18 * * *"]

# ── R2（配信画像ホスティング）──
# Notion files「画像」→ R2 → 恒久公開URL で LINE 送信する（画像 put は承認 pin 時のみ）。
# 値はコミットしない。R2_API_TOKEN は secret（`wrangler secret put R2_API_TOKEN`）。
# 非機密の R2_BUCKET_NAME / R2_PUBLIC_BASE / R2_ACCOUNT_ID は [vars] か secret で設定する。
#   R2_ACCOUNT_ID   = "<Cloudflare account id>"   # 上部の account_id と同一
#   R2_BUCKET_NAME  = "elxea-images"
#   R2_PUBLIC_BASE  = "https://pub-xxxx.r2.dev"
#   secret: R2_API_TOKEN                          # Workers R2 Storage: Edit 権限のトークン

# ── Staging 環境 ──
[env.staging]
name = "elxea-agent-staging"

# ── 非機密 vars のみ ──
# Cloudflare は env ごとに vars が独立（top-level [vars] は staging に継承されない）ため、
# staging で必要な非機密 var はここに明示する。
#   DELIVERY_TARGET_ENV = "test": staging は必ず「テスト OA（@426vlcyb）」に固定する。
#     src/lib/delivery-channel.ts が targetEnv=test のとき LINE_CHANNEL_ACCESS_TOKEN_TEST を選ぶ。
#     → staging から本番 OA（@307tzhkw / 友だち 38）へ誤送信しないための固定。
#   ⚠ 2026-08-22: staging も「承認したら実送信」になった（実送信スイッチ撤去）。
#     staging で Status=Approved にした行は、テスト OA（@426vlcyb）の友だちに実際に届く。
#     「未設定だから送られない」という前提はもう成立しない。テスト用 LINE を必ず使うこと。
# ⚠ 秘密（値はコミットしない・[vars] に書かない）は全て secret として別途投入する:
#     wrangler secret put LINE_CHANNEL_ACCESS_TOKEN_TEST --env staging
#     wrangler secret put LINE_CHANNEL_SECRET_TEST       --env staging
#     wrangler secret put SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / ANTHROPIC_API_KEY 等 --env staging
#     wrangler secret put FIREBASE_* / R2_API_TOKEN 等                                   --env staging
#   （必要な secret 一覧・投入順は docs/deploy-runbook.md の「Staging Bring-Up」を参照）
[env.staging.vars]
DELIVERY_TARGET_ENV = "test"
# 【staging 限定・ブロック4 連携導線】トーク内入り口の「連携ボタン」の遷移先 LIFF URL。
# 設定時のみ、未連携ユーザーの連携文脈（完全一致トリガー / ④定期便の未連携分岐）に
# 「便益1行 + 連携ボタン（この URL を開く URI アクション）」を出す。
# ⚠ 本番 [vars] には絶対に置かない（未設定=fail-safe: ボタンを出さず従来テキスト elxea.com/ja に倒す）。
#   本番での有効化は GA/昇格ゲートで別途判断（そのとき本番 [vars] か secret で明示投入する）。
#
# ⚠ 2026-08-25 (M-0 / 再設計 Wave 2): チャネルを **テストチャネル 2011239440** へ切り替えた。
#   旧値は 2009473839-ubrqGbMF で、これは **旧本番 Login チャネル 2009473839** の LIFF である。
#   その 2009473839 は本番 OA @307tzhkw (Messaging 2008324925) と**別プロバイダ**にあり、
#   「同じ人でも userId の番号体系が違う」という、今回の再設計の最深部の原因そのものだった
#   (設計書 §0 / Issue https://app.notion.com/p/3a470c9d064c81f28f8cce60db8ff8be)。
#   M-0 で本番 OA と同一プロバイダに Login チャネルを新設し、本番 = 2011239425 /
#   テスト = 2011239440 に揃えた。staging は必ずテスト OA (@426vlcyb) 側を向くので、
#   ここもテストチャネルの LIFF を指す。
#   ⚠ ここに本番 (2011239425) の LIFF を書かないこと。staging から本番 OA 文脈の連携を
#     踏ませることになり、DELIVERY_TARGET_ENV="test" で作った隔離が崩れる。
LIFF_LINKAGE_URL = "https://liff.line.me/2011239440-0wahaqmd"
# 【staging 限定・ブロック4 テスト連携キット】定期便扱いにする合成 LINE userId（U+32hex・非実在）。
# subscriber-linkage.ts は DELIVERY_TARGET_ENV="test" のときだけこの allowlist を見る（本番 "prod" では常に無効）。
# 実在ユーザーの ID は絶対に入れない。本番 [vars] には絶対に置かない。
TEST_SUBSCRIBER_LINE_IDS = "Ub10c4deadbeef0000000000000000000"
# チャット返信モデル（最安クラス Haiku 4.5）。モデル名は機密でないため vars で管理する。
# 未設定でも core.ts の DEFAULT_REPLY_MODEL に同値でフォールバックするが、staging では明示する。
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"

[env.staging.ai]
binding = "AI"

# ── Staging 限定 Cron Triggers（P0-7b 配信計測 fetch + ブロック3-B 休眠検知）──
# Cloudflare の triggers は継承キー（vars と違い env に継承される）。ここで env 上書きすると
# top-level [triggers] を「置換」するため、top-level に残る 1 本（同期 03:00 JST）を再掲した
# うえで stats（04:00 JST）を足す。これで staging = 同期+計測、本番 = 同期のみ。
#   ⚠ 2026-08-22 完全オンデマンド化: staging からも配信 cron "*/15 * * * *" を外した。
#     staging の配信検証は `POST /api/delivery/run`（テスト OA 宛て）で明示的に叩いて行う。
#   ⚠ 本番 [triggers] には stats を入れない（本番配信計測の有効化は GA/昇格ゲートで別途判断）。
#   - "0 19 * * *"（04:00 JST）: classifyCron → "stats" → runBroadcastStatsFetch。
#       読み取り専用（LINE Insight GET + Supabase）。LINE 送信系 API は呼ばない（実配信ゼロ）。
#       broadcast_stats（migration 024）未適用時は fail-soft（ok:false 理由ログ・例外を投げない）。
#
# ── ブロック3-B 休眠検知の cron（専用トリガは付けられないため stats tick に同居）──
#   Cloudflare の cron trigger はアカウント上限 5 本（配信 cron 撤去後は 本番 1 + staging 2 = 3 で
#   枠に余裕はあるが、休眠専用トリガの新設は別途 GA 判断とし、同居のまま据え置く）。
#   6 本目（"0 20 * * *"）は 10072「exceeded the limit of 5 cron triggers」で登録拒否される（実測 2026-07-16）。
#   よって専用トリガを新設せず、staging 限定の stats tick（0 19・本番 triggers に無い）に休眠スキャンを同居させる
#   （index.ts の "stats" 分岐が runBroadcastStatsFetch と runDormantReengagement を両方 waitUntil する）。
#   これで「新規トリガ 0 本・staging 限定・本番非実行」を満たす。
#   ⚠ 既定は送信封鎖（DORMANT_SEND_ENABLED != "true" で dry-run: 候補と本文を dormant_reengagement_log
#     へ記録するだけ・LINE 送信系 API 非接触）。staging でも DORMANT_SEND_ENABLED は置かない（実送信ゼロ）。
#   DORMANT_CRON_PATTERN("0 20 * * *") と classifyCron の "dormant" 分岐は、将来 cron 枠が空いたときに
#   専用トリガへ移すための配線として残す（現状は未登録＝不活性・手動は /api/dormant/run で起動可能）。
#
# ── spec drift #1 マルシェ活性化ナッジも stats tick に同居（新規トリガ 0 本・staging 限定）──
#   休眠と同じ 5 トリガ上限の制約により専用トリガを付けられないため、index.ts の "stats" 分岐が
#   runBroadcastStatsFetch / runDormantReengagement に続けて runMarcheActivation も waitUntil する。
#   stats（0 19）は staging 限定トリガ（本番 [triggers] に無い）なので活性化スキャンも本番では実行されない。
#   ⚠ 既定は送信封鎖（MARCHE_SEND_ENABLED != "true" で dry-run: 候補と本文を marche_activation_log へ
#     記録するだけ・LINE 送信系 API 非接触）。staging でも MARCHE_SEND_ENABLED は置かない（実送信ゼロ）。
#     手動疎通は /api/marche-activation/run で起動可能（dry-run・対象0でも正常終了）。
#   しきい値/窓/上限は env で調整可（MARCHE_ACTIVATION_THRESHOLD_DAYS=1 / _WINDOW_DAYS=14 / _PER_RUN_CAP=20 が既定）。
[env.staging.triggers]
crons = ["0 18 * * *", "0 19 * * *"]
