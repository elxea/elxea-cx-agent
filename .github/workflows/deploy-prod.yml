name: deploy-prod

# 本番フル反映（migration 本適用 → wrangler deploy → prod health check）のワンコマンド。
# 実体は scripts/deploy-prod.sh に一本化し、この workflow は「承認ゲート + secret 注入 + 呼び出し」だけを担う。
#
# 起動: 手動（workflow_dispatch）のみ。push では絶対に走らない（本番反映を自動化しない）。
# 二重ゲート:
#   (1) confirm 入力が "DEPLOY-PROD" でなければ preflight で中断。
#   (2) environment: production の Required reviewers（GitHub 側承認）を通過しないと job が始まらない。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-PROD to proceed (誤爆防止の合言葉)'
        required: true
        type: string
      first_deploy:
        description: '初回デプロイ（日次同期 cron を初活性化する）なら true'
        required: false
        default: false
        type: boolean
      first_deploy_ack:
        description: 'first_deploy=true のとき SYNC-CRON-ACK を入力（cron 初活性化に同意）'
        required: false
        default: ''
        type: string
      migrate_only:
        description: '今回当てる migration を名指し（例: 036,037）。当てないなら NONE。※未適用を全件当てる指定は無い'
        required: true
        default: 'NONE'
        type: string
      migrate_denylist_ack:
        description: '本番非適用リスト（024/025/027）を今回だけ当てるときのみ version を入力（通常は空）'
        required: false
        default: ''
        type: string

# 本番反映の同時実行を禁止（途中の migration/deploy が競合しないように直列化する）。
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ⚠ GitHub Environments の承認ゲート。production に Required reviewers を設定しておくこと。
    environment: production
    env:
      CONFIRM: ${{ github.event.inputs.confirm }}
      FIRST_DEPLOY: ${{ github.event.inputs.first_deploy }}
      FIRST_DEPLOY_ACK: ${{ github.event.inputs.first_deploy_ack }}
      # migration は明示指定制（未指定は scripts/deploy-prod.sh 側で中断＝ fail-closed）。
      MIGRATE_ONLY: ${{ github.event.inputs.migrate_only }}
      MIGRATE_DENYLIST_ACK: ${{ github.event.inputs.migrate_denylist_ack }}
      # 本番 Cloudflare / Supabase の認証。値は GitHub Secrets に保持する（ここには書かない）。
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # staging smoke の対象（本番反映前の緑確認）。
      STAGING_WORKER_URL: https://elxea-agent-staging.setaka-on.workers.dev
    steps:
      - name: Guard — confirm 入力の即時検証
        run: |
          if [ "${CONFIRM}" != "DEPLOY-PROD" ]; then
            echo "::error::confirm='${CONFIRM}' が不正。DEPLOY-PROD を入力すること。"
            exit 1
          fi
          echo "confirm OK"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # preflight → migration 適用（MIGRATE_ONLY で名指しした分のみ）→ wrangler deploy → prod health check
      # （順序は scripts/deploy-prod.sh が担保）。
      - name: 本番フル反映（scripts/deploy-prod.sh）
        run: ./scripts/deploy-prod.sh
