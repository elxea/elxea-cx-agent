name: CI

on:
  push:
    branches: [master, developer]
  pull_request:
    branches: [master]
  # 手動トリガ専用の実行経路。prod Supabase を読む search-quality はこの経路でのみ走らせ、
  # push（master/developer）では走らせない（= master への毎マージを staging-only に保つ）。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.ci.json --noEmit

  unit-tests:
    name: unit-tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  hermetic-e2e:
    name: hermetic-e2e
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ハーメティック L1（バックエンド動線・返答本文の自動判定）。ネットワーク不使用・モックのみ。
    # 秘密不要で PR / push 両方で走る（master-push 限定の e2e-tests とは別の PR ゲート）。
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:hermetic

  e2e-tests:
    name: e2e-tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    env:
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET_TEST }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
      STAGING_WORKER_URL: https://elxea-agent-staging.setaka-on.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  search-quality:
    name: search-quality
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # search-quality は Supabase を直接 createClient で叩く（tests/search-quality/run-search-quality.ts）。
    # secrets.SUPABASE_URL は本番 Supabase（ref bquqzrbzdzjegdovxalu）を指すため、push で走ると
    # master への毎マージが本番 Supabase を READ してしまう。これを断つため手動 workflow_dispatch 専用に隔離する。
    # （定期監視が必要になれば別途 schedule を足す判断を人間側で行う。既定は自動での本番接触ゼロ。）
    if: github.event_name == 'workflow_dispatch'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:search-quality

  deploy-staging:
    name: deploy-staging
    # search-quality を push から外した（workflow_dispatch 専用）ため needs から除外する。
    # 残すと push 時に search-quality が skip され、その skip が deploy-staging に伝播して
    # staging デプロイが恒久 skip される（GitHub Actions の skipped-need 伝播）。
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler deploy --env staging
      - name: Staging smoke test
        run: pnpm test:staging-smoke
        env:
          STAGING_WORKER_URL: https://elxea-agent-staging.setaka-on.workers.dev
