<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  .grid {
    width: 2500px; height: 1686px;
    display: grid;
    grid-template-columns: 833px 833px 834px;
    grid-template-rows: 843px 843px;
  }
  .cell {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center;
    /* subtle hairline dividers between cells */
    box-shadow: inset -1px -1px 0 0 rgba(70,71,72,0.05);
  }
  /* top row lighter, bottom row a touch warmer/darker (matches approved v2 two-tone) */
  .row1 { background: #EBE9E0; }
  .row2 { background: #E4E1D6; }

  /* FINAL (owner-approved sm14 + gap tweak): circle 280px, group re-centered in the 843 cell.
     top 200 -> 196 to keep the (circle+gap+label) group vertically centered after the wider gap. */
  .circle {
    position: absolute;
    top: 196px;               /* group height 280+80+90=450; (843-450)/2 = 196 */
    width: 280px; height: 280px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .row1 .circle { background: #E3E1D5; }
  .row2 .circle { background: #DBD8CA; }

  /* BIGGER: glyph 92 -> 132 (+43%) => ~20.6 dp on screen */
  .circle svg {
    width: 132px; height: 132px;
    display: block;
    stroke: #464748;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
  /* FINAL label 90px (unchanged). dp = 90 x (390/2500) = 14.0 dp.
     GAP TWEAK: icon-bottom -> label gap 55px -> 80px (+25px, ~8.6dp -> ~12.5dp, +~4dp)
     so the icon and label are no longer cramped. Label size & 6-slot layout unchanged. */
  .label {
    position: absolute;
    top: 556px;               /* circle bottom (196+280=476) + 80 gap = 556 */
    width: 100%;
    text-align: center;
    color: #464748;
    font-size: 90px;
    font-weight: 500;
    letter-spacing: 0.02em;   /* slightly tighter so the long label fits one line */
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="grid">

    <!-- 上左: お茶の淹れ方 -->
    <div class="cell row1">
      <div class="circle">
        <svg viewBox="0 0 24 24">
          <path d="M5 8h11v4.2a5.4 5.4 0 0 1-5.4 5.4H10.4A5.4 5.4 0 0 1 5 12.2V8z"/>
          <path d="M16 9h1.6a2.6 2.6 0 0 1 0 5.2H16"/>
          <path d="M4 20.4h13"/>
          <path d="M8 3.1c-.6.9-.6 1.5 0 2.4"/>
          <path d="M12 3.1c-.6.9-.6 1.5 0 2.4"/>
        </svg>
      </div>
      <div class="label">お茶の淹れ方</div>
    </div>

    <!-- 上中: 好み診断 -->
    <div class="cell row1">
      <div class="circle">
        <svg viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <path d="m20.5 20.5-4.6-4.6"/>
        </svg>
      </div>
      <div class="label">好み診断</div>
    </div>

    <!-- 上右: マイカルテ (NEW) -->
    <div class="cell row1">
      <div class="circle">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="2.2"/>
          <circle cx="8.6" cy="10.6" r="2.2"/>
          <path d="M5.4 15.8c.6-1.7 1.9-2.5 3.2-2.5s2.6.8 3.2 2.5"/>
          <path d="M14.6 9.6h4"/>
          <path d="M14.6 13.2h4"/>
        </svg>
      </div>
      <div class="label">マイカルテ</div>
    </div>

    <!-- 下左: 定期便 -->
    <div class="cell row2">
      <div class="circle">
        <svg viewBox="0 0 24 24">
          <rect x="3.2" y="8" width="17.6" height="4" rx="1"/>
          <path d="M12 8v13"/>
          <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
          <path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8"/>
          <path d="M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8"/>
        </svg>
      </div>
      <div class="label">定期便</div>
    </div>

    <!-- 下中: 読みもの (NEW) -->
    <div class="cell row2">
      <div class="circle">
        <svg viewBox="0 0 24 24">
          <path d="M12 7.2v13.4"/>
          <path d="M3 17.8a1 1 0 0 1-1-1V4.6a1 1 0 0 1 1-1h4.8A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 4.2-3.6H21a1 1 0 0 1 1 1v12.2a1 1 0 0 1-1 1h-5.4a3 3 0 0 0-3.6 2.4 3 3 0 0 0-3.6-2.4z"/>
        </svg>
      </div>
      <div class="label">読みもの</div>
    </div>

    <!-- 下右: elxea について -->
    <div class="cell row2">
      <div class="circle">
        <svg viewBox="0 0 24 24">
          <path d="M6 18.2C6 9.4 11.8 4.4 20.2 4.4c0 8.4-5.2 13.8-14 13.8z"/>
          <path d="M6.2 18 14.4 9.9"/>
        </svg>
      </div>
      <div class="label">elxea について</div>
    </div>

  </div>
</body>
</html>
